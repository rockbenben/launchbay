name: 🐳 发布镜像（Docker Hub + GHCR）

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# 与 ci.yml 是同一件事、同一句话：同一个 ref 连触发三次，只有最后一次该跑完。前两次
# 还在排队等 runner，而每次发镜像是完整的多架构构建（amd64 + arm64，QEMU 模拟）。
#
# **group 必须与 ci.yml 的不同名**（那边是 ci-${{ github.ref }}）。共用一个 group
# 时两个 workflow 会互相取消：推 tag 的那一刻，发镜像这轮刚起来就被 CI 掐掉，
# 镜像停在旧提交上——而那正是「latest 指的是哪份代码」出错的时刻。
concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
# contents: read 是 checkout 要的；packages: write 是推 GHCR 必需的，缺了直接 403。
# 只读代码 + 可写镜像，两者互不相干，所以权限按最小集合分开声明。

# 撞了名的镜像会被别人 push 覆盖推走，所以命名空间带用户名而不是裸 launchbay。
env:
  IMAGE_NAME: launchbay

jobs:
  publish:
    name: 构建并推送多架构镜像
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # fetch-depth: 0 是取全部历史——metadata-action 的 semver 与 prune 都要看到
      # tag。默认的浅克隆看不到它们，tag 会被静默少掉一半。
      - name: 取代码
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # 版本号直接来自 **git tag**——metadata-action 的 `type=semver` 不给 `value=` 时
      # 就按 `github.ref` 里那个 tag 取，所以**没有任何一处需要额外维护版本号**。
      # 早先是从 docker-compose.yml 的 image 标签里 grep 出来的，于是版本号有两个
      # 可能的写法（compose 与 tag），"这次该改哪一个"每次发版都要重想一遍；而
      # compose 换成 `:latest` 之后标签里更没有版本号可读，那条 grep 必然取空、
      # 整轮发版停在自己的 ::error:: 上。tag 是"这一轮是哪个版本"的天然答案。
      #
      # **push 到 main 不发镜像**：那一步只剩 latest + sha，会让 `:latest` 指向一个
      # 从没发过版的提交，而 compose 里正是拉 `:latest`。镜像门禁归 ci.yml 的
      # `docker build -t launchbay:ci .`，不靠这一轮。
      #
      # arm64 靠 QEMU 模拟：树莓派、群晖的 ARM 机型才是这类自托管项目真正会跑
      # 上去的机器，不出 arm64 镜像等于把一半的目标设备排除在外。
      - name: 准备 QEMU
        uses: docker/setup-qemu-action@v4

      - name: 准备 Buildx
        uses: docker/setup-buildx-action@v4

      - name: 登录 Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 登录 GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          # 推本仓库的镜像用内置 token 即可，不需要额外 PAT。
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 生成 tags 与 labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ vars.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}
            ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          # semver 三档都不给 value=：版本号由上面那个 git tag 决定。
          # 没有 tag 的触发（workflow_dispatch）就只剩 latest 与 sha 两档，
          # 那是有意的形状——它推的是一个没发过版的构建，用 :latest 的人
          # 要的就是"给我刚才按下的那一次"。
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest
            type=sha,format=short

      # build-push-action 只在**构建成功**之后才推：门禁（在 Dockerfile 的 amd64
      # 那一路里跑）或交叉编译失败，push 根本不会发生。所以这一条不需要额外的
      # "先验后发"步骤。
      - name: 构建并推送
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # gha 缓存让第二次构建只重跑改动过的层。mode=max 连中间层一起留，
          # 慢一点但下次几乎全命中——自托管项目的发版频率低，划算。
          cache-from: type=gha
          cache-to: type=gha,mode=max
