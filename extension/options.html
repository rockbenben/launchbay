<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<!-- 页面里**没有一句写死的话**：每一格文字都由 options.js 从 _locales 填进来
     （`data-i18n` / `data-i18n-rich`）。留一份中文兜底就等于同一条句子有
     两处可改，而那两处一定会分家——主站的模板也是 `{{.T "key"}}` 一个兜底
     都不留。<title> 与 <h1> 那两处先写产品名 launchbay：它不是待翻的句子，
     而脚本万一没跑成时这一页至少还认得出是谁家。
     `lang` 属性留在 zh-CN 是因为 HTML 里这一个属性写不了目录里的值——它由
     options.js 按界面语言改掉（applyI18n 里那一行 documentElement.lang）。 -->
<title>launchbay</title>
<style>
  /* color-scheme + 一套暗色覆写：这一页是"在自己电脑上配一次"的界面，
     深夜配机器时整页纯白很刺眼。写死浅色是它以前唯一的问题——不是设计，
     是没人写过暗色那一档。 */
  :root{color-scheme:light dark;--fg:#1c1c1e;--fg2:#555;--line:#ccc;--bg:#fff;--panel:#f3f3f3;--code:#fafafa;
    --bad:#b3261e;--ok:#1c6b2e}
  @media (prefers-color-scheme:dark){
    :root{--fg:#e9edf8;--fg2:#a7b2cd;--line:#3a4152;--bg:#12151d;--panel:#1c2230;--code:#0c0f16;
      --bad:#ffb3ad;--ok:#7ee2a0}
  }
  body{font:15px/1.6 system-ui,"PingFang SC","Microsoft YaHei",sans-serif;max-width:38em;margin:2em auto;padding:0 1em;
    background:var(--bg);color:var(--fg)}
  label{display:block;margin:14px 0 4px;font-size:13px;color:var(--fg2)}
  input[type=url],input[type=password],input[type=text]{width:100%;box-sizing:border-box;
    padding:9px;font:inherit;background:var(--bg);color:inherit;border:1px solid var(--line);border-radius:7px;min-height:44px}
  button{padding:9px 16px;font:inherit;min-height:44px;border:1px solid var(--line);
    border-radius:7px;background:var(--panel);color:inherit;cursor:pointer}
  button:focus-visible,input:focus-visible{outline:3px solid #4c8dff;outline-offset:2px}
  .row{display:flex;gap:8px;align-items:center}
  /* 「删掉这一枚」必须待在自己那一行里。flex 项目默认 min-width:auto，
     而中文**每个字都能断行**，所以它的 min-content 只有一个字宽——令牌那一栏
     一撑，这颗键就被挤成竖排的四行（实拍：删/掉/这一/枚）。
     不缩 + 不换行，两个都要写：只写 nowrap 它还会被压扁到溢出。 */
  .row button{flex:0 0 auto;white-space:nowrap}
  /* 令牌那一列是 password：给它 flex:1，id 列固定宽，两列一眼分得开。
     以前三列都没有列头，用户看到的就是"两个不知道是什么的框 + 一个删字按钮"。 */
  .row input[type=password]{flex:1 1 auto;min-width:0}
  .cols{display:flex;gap:8px;font-size:12px;color:var(--fg2);margin-top:12px}
  /* id 那一列的宽度必须**列头与输入框同宽**，否则第二列的列头会横着错开一截
     （实测：列头 108px、输入框 135px，差 27px——两格都写 9em 却是两个数，
     因为 em 按各自元素的字号算，而列头 12px、输入框跟着 body 的 15px）。
     这一页的字号是写死的 15px，所以 9em 恒等于 135px：钉一个绝对值，两边各引
     一次，谁也不会再"顺手改一下 em"。 */
  :root{--col-id-w:135px}
  .cols span:first-child{flex:0 0 var(--col-id-w)}
  .row input[type=text]{flex:0 0 var(--col-id-w)}
  .note{font-size:13px;color:var(--fg2);margin:6px 0 0}
  .bad{color:var(--bad);font-weight:600}
  .ok{color:var(--ok)}
  /* #msg 以前只有一句"已保存"换颜色：颜色是唯一的载体，读屏的人听不到任何
     变化（role=status + aria-live 让它念出来），色弱的人也分不清成没成。
     成/败各带一个文字前缀，不靠颜色。 */
  #msg:not(:empty){border:1px solid var(--line);border-radius:7px;padding:8px 10px;font-size:14px}
  #msg.bad{border-color:var(--bad)}
  hr{border:0;border-top:1px solid var(--line);margin:2em 0}
  code{font-size:13px}
  /* 报告原文照贴，不折叠：它是这一页存在的意义。pre-wrap + break-all 让长行
     换行而不是横向滚出去——报告里有 URL 与 JSON 片段，不换行就会被切掉。 */
  pre{white-space:pre-wrap;word-break:break-all;font-size:12px;line-height:1.5;
    background:var(--code);border:1px solid var(--line);border-radius:7px;padding:10px;max-height:26em;overflow:auto}
  /* 服务端渲染好的那份报告（HTML）贴进来时用的排版。与主站 .rep 同一族，
     但这里是扩展自己的页面，不共享 CSS。 */
  #bmreport{text-align:left}
  #bmreport h3{font-size:13px;color:var(--fg2);margin:14px 0 4px}
  #bmreport p,#bmreport li{font-size:13px}
  #bmreport code{background:var(--code);padding:1px 4px;border-radius:4px;word-break:break-all}
  /* 窄窗口里这一行装不下三样东西：id 那一列 135 + 删除键 109，令牌框只剩一条缝
     （实拍 320 那一档：30px，看不见自己贴进去的是什么）。换成一格一行，列头撤掉
     ——每一格由自己的 placeholder 说清自己是谁（id 框的 placeholder 就是列头那句
     "档案 id"，令牌框本来就写着"这一枚档案作用域的令牌"）。
     断点跟着**内容宽**走：这一行需要 135+8+200+8+92=443 才不难看，而 body 的
     38em(570) 减掉两侧 padding 之后，520 以下就开始挤。与主站台面面板同一档。 */
  @media (max-width:520px){
    .cols{display:none}
    .row{flex-direction:column;align-items:stretch}
    .row input[type=text]{flex:none}
  }
</style>
</head>
<body>
<h1 data-i18n="extName">launchbay</h1>

<label for="base" data-i18n="lblBase"></label>
<input id="base" type="url" placeholder="http://10.0.0.3:7600">
<p class="note" data-i18n="noteBase"></p>

<label for="prof" data-i18n="lblProf"></label>
<input id="prof" type="text" placeholder="dad">
<p class="note" data-i18n="noteProf"></p>

<div class="cols"><span data-i18n="colId"></span><span data-i18n="colToken"></span></div>
<div id="rows"></div>
<p class="note" data-i18n-rich="noteToken"></p>

<hr>
<p id="msg" role="status" aria-live="polite"></p>
<p><button id="save" data-i18n="btnSave"></button>
  <button id="test" data-i18n="btnTest"></button></p>
<p class="note" data-i18n-rich="noteTest"></p>

<hr>
<h2 data-i18n="bmHeading"></h2>
<p class="note" data-i18n-rich="noteBookmarks"></p>
<p><button id="bmimport" data-i18n="btnReadBookmarks"></button></p>
<div id="bmreport" class="note" hidden></div>
<p><button id="bmapply" data-i18n="btnApply" hidden></button>
  <button id="bmcancel" data-i18n="btnCancel" hidden></button></p>

<!-- 只引一份：options.js 是 ES module，它 import 的 i18n.js / import.js 由模块图
     自己带进来。三个 <script> 分别加载是经典脚本时代的形状，那样 `t` 得挂在全局
     上，而模块没有全局——少一处显式 import 就变成运行时才报的 ReferenceError。 -->
<script type="module" src="options.js"></script>
</body>
</html>
