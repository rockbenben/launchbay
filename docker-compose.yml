# 项目名钉死成 launchbay。不写的话 compose 拿**目录名**当项目名：clone 到
# `042-launchbay` 就是 `042-launchbay`，clone 到 `launchbay-main` 又是另一个，
# 同一份文件起出两套互不相认的容器与网络，`down` 也只清得掉自己那半边。
# 优先级在 `-p` 与 `COMPOSE_PROJECT_NAME` 之后，那两个仍然盖得住它。
name: launchbay

# 这个文件只负责**拉**已发布的镜像。构建是 CI 的事：打 `v*` tag，
# `.github/workflows/docker.yml` 构建并推出 amd64 + arm64 两个架构到
# Docker Hub 与 GHCR。用它的人不需要装 Go，也不需要看 Dockerfile。
services:
  launchbay:
    image: ghcr.io/rockbenben/launchbay:latest
    container_name: launchbay
    # 不写 pull_policy，用默认的 missing。实测（Compose v2.40 / Engine 28.5）：
    # `up` 看到本机已经有这个标签就直接用，**不会**顺手上仓库确认一遍。
    # 代价在发新版那一侧：已经在跑的用户要 `docker compose pull` 才拿得到新的。
    #
    # 宿主端口默认 7600（spec §10）。本机 Windows 把 TCP 7532-7631 整段划给了
    # Hyper-V 动态保留，撞上了就在前面加 LAUNCHBAY_HOST_PORT=7601。
    # 容器内端口与 LAUNCHBAY_PORT 一律不动，healthcheck 探的仍是 7600。
    ports: ["${LAUNCHBAY_HOST_PORT:-7600}:7600"]
    volumes:
      # 数据落在 compose 同目录的 ./data，想放别处就改这一行（示例见 README）。
      # 容器内永远是 /data——healthcheck 与 LAUNCHBAY_DATA_DIR 都认它。
      #
      # **首次拉起之前先 chown**：镜像以 USER 65534 跑，宿主上 root 所属的目录
      # 挂进去之后建档与写书签会全部失败：
      #   sudo chown -R 65534:65534 ./data
      - ./data:/data
    environment:
      LAUNCHBAY_PORT: "7600"
      LAUNCHBAY_DATA_DIR: "/data"
      # **这两行就是全部的令牌配置**，没有 `.env`、没有第二层变量。
      # 要改就直接改这里，改完 `docker compose up -d` 重起。
      #
      # 格式是 `名字:密钥:档案`，逗号分隔。下面两枚的密钥是**占位值**，
      # 谁都在仓库里看得见：同一局域网里认得这个名字的人能拿 `admin` 那枚
      # 建档、删档、给别人改 PIN（但**读不到任何人的书签**——那要档案自己的
      # PIN，而 PIN 只有档案主人知道）。要把这台机器开给局域网以外的人，
      # 先把这两个 `change-me-…` 换成自己的。
      #
      # 档案段 `…:dad` 要对上你真正建出来的档案 id：建档只问名字与 PIN，id 由名字
      # 派生（`Dad` → dad；**中文名字转不出 slug** → home / home-2）。拿中文名字建了
      # 第一个档案之后，下面那枚 `…:dad` 的作用域对不上任何档案，打过去是 403
      # ——那是"令牌越界"的 403，不是服务坏了。把 `dad` 改成实际的档案 id 即可。
      LAUNCHBAY_WRITE_TOKENS: "ai-dad:change-me-dad-token:dad,admin:change-me-admin-token:*"
      TZ: Asia/Shanghai
    restart: unless-stopped
    # 静态二进制要的能力一个都没有：7600 是高位端口，不需要 CAP_NET_BIND_SERVICE；
    # 唯一的写入目标是 /data 那个挂载，靠 uid 65534 的文件权限就够。全丢掉，再加
    # no-new-privileges 堵住「容器里被塞进一个 setuid 就提权」那条路。
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      # scratch 里没有 shell，所以走 CMD-signal 之外的方式：让二进制自己探。
      # 探的不只是 /healthz：`launchbay healthcheck` 会在 LAUNCHBAY_DATA_DIR
      # 里建删一个临时文件——65534 用户碰到 root 所属的挂载目录（群晖常见）
      # 时，只探 HTTP 会永远误报 healthy（评审 Important #9）。
      # 前提：宿主那个目录需对该 uid 可写（chown -R 65534:65534），
      # 不满足时这里要能看到 unhealthy，而不是装作能写——失败消息里带着
      # 那条 chown 命令，读的人不用再猜是哪一侧的权限。
      #
      # **不写 start_interval**：那一条要 Docker Engine 25+（群晖 DSM 7.2 还是
      # 24.x），为了早几秒变 healthy 去卡掉一批 NAS 用户不值。
      test: ["CMD", "/launchbay", "healthcheck"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s