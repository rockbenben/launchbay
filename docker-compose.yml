name: launchbay

services:
  launchbay:
    image: ghcr.io/rockbenben/launchbay:latest
    container_name: launchbay
    # 不写 pull_policy：`up` 不会上仓库确认一遍，已在跑的机器要 `docker compose pull` 才拿得到新版。
    # 宿主端口 7600；被占就 `LAUNCHBAY_HOST_PORT=7601`（Windows 上 7532-7631 常被 Hyper-V 预留）。
    # 容器内恒为 7600 —— healthcheck 探的也是它。
    ports: ["${LAUNCHBAY_HOST_PORT:-7600}:7600"]
    volumes:
      # 数据落在 compose 同目录的 ./data。**首次拉起前先 chown**，否则建档与写书签全失败：
      #   sudo chown -R 65534:65534 ./data
      - ./data:/data
    environment:
      LAUNCHBAY_PORT: "7600"
      LAUNCHBAY_DATA_DIR: "/data"
      # 管理员是一把**裸 key**（不属于任何档案，浏览器那边靠 `/admin/login` 输它）。
      # 它只管账号（建档/删档/设 PIN/停用/看跨档案状态），读不到任何人的书签。
      # ⚠ 下面那个值是**公开的默认口令**，源码里就有：同一局域网里认得这个名字的人
      #   就能建档、删档、给你改 PIN（那会让你登不进自己那份，书签还在盘上）。**换成你自己的。**
      LAUNCHBAY_ADMIN_TOKEN: "launchbay123"
      # 档案作用域令牌，**默认留空**：书签页、管理页、回退、导入全走会话 cookie，一个令牌都不需要。
      # 只有三样要它：浏览器扩展、`launchbay revert` / `import-bookmarks` / `backup` / `restore`、AI 与自动化脚本。
      # 要用就填上再 `docker compose up -d`：名字:密钥:档案 —— 档案段写具体 id 时只管那一份。
      # id 由名字派生（`Dad` → `dad`；中文名转不出 slug，落到 `home`），填完记得对上真建出来的那一份。
      LAUNCHBAY_WRITE_TOKENS: ""
      TZ: Asia/Shanghai
    restart: unless-stopped
    # 静态二进制一个能力都不需要：7600 是高位端口，唯一写入目标是 /data，靠文件权限就够。
    # 再加 no-new-privileges 堵住「容器里被塞进 setuid 就提权」那条路。
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "/launchbay", "healthcheck"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s