services:
  launchbay:
    build: .
    # **两条路都在这一份里**（2026-10-12）：version 标签指向发布的镜像，
    # pull_policy 决定这一趟去哪儿拿。
    #   · 默认 build   —— clone 下来的人按 README 编译本机的（NAS 上编译几分钟）；
    #   · always       —— 直接拉发布镜像，不编译（`LAUNCHBAY_PULL_POLICY=always`）；
    #   · missing      —— 本地没有就拉，有就用本地的。
    # 早先这里写的是 `image: launchbay:0.1.0`，于是 **image 这行没有仓库前缀**，
    # compose 只会去找本地镜像或自己构建，发布到 GHCR 的那个镜像**永远用不到**——
    # 而 README 另一头正教人 `docker run ghcr.io/rockbenben/launchbay:latest`。
    # 两条路各说各的，读者得自己猜它们是不是一回事。现在是同一份 compose 两条路。
    #
    # 版本号仍然只有这一处：docker.yml 发版时从**这一行** grep（那一步的正则
    # 跟着放宽成能带仓库前缀），.env 与 README 都只引用它，不再各写一份。
    image: ghcr.io/rockbenben/launchbay:0.1.0
    pull_policy: ${LAUNCHBAY_PULL_POLICY:-build}
    container_name: launchbay
    # 宿主端口默认 7600（spec §10），可用 LAUNCHBAY_HOST_PORT 覆盖：
    # 本机 Windows 把 TCP 7532-7631 整段划给了 Hyper-V 动态保留，7600 直接
    # bind 不上（ports are not available）。容器内端口与 LAUNCHBAY_PORT
    # 一律不动，healthcheck 探的仍是 7600。
    ports: ["${LAUNCHBAY_HOST_PORT:-7600}:7600"]
    # 数据落在宿主上的位置由 LAUNCHBAY_HOST_DATA 决定（默认 ./data，见 .env.example）。
    # 用**长语法**而不是 "./data:/data" 那种短串：短语法里 `D:\somewhere:/data`
    # 的冒号会被当成分隔符，Windows 盘符路径正是这条的经典翻车点。长语法把
    # source/target 分成两格，盘符的冒号就没有歧义了。
    # 容器内路径永远是 /data，不跟着变——healthcheck 与 LAUNCHBAY_DATA_DIR 都认它。
    volumes:
      - type: bind
        # **首次拉起之前先 chown**：镜像以 USER 65534 跑（见 Dockerfile），
        # 宿主上 root 所属的 ./data 挂进去之后建档与写书签会全部失败。
        # 修法就一条，见 README「数据目录的权限」：
        #   sudo chown -R 65534:65534 ./data
        source: ${LAUNCHBAY_HOST_DATA:-./data}
        target: /data
    environment:
      LAUNCHBAY_PORT: "7600"
      LAUNCHBAY_DATA_DIR: "/data"
      # **两枚令牌的档案段要对上你真正建出来的档案 id**：建档只问名字与 PIN，
      # id 由名字派生（`Dad` → dad，中文名字转不出 slug → home / home-2）。
      # 拿中文名字建了第一个档案之后，下面那枚 `…:dad` 的作用域对不上任何档案，
      # 打过去是 403——这是"令牌越界"的 403，不是服务坏了。改这里的 `dad` 即可，
      # 或用 `launchbay profile create --id dad …` 建一份就叫 dad 的档案。
      LAUNCHBAY_WRITE_TOKENS: "ai-dad:${LAUNCHBAY_TOKEN_AI_DAD}:dad,admin:${LAUNCHBAY_TOKEN_ADMIN}:*"
      TZ: Asia/Shanghai
    restart: unless-stopped
    healthcheck:
      # scratch 里没有 shell，所以走 CMD-signal 之外的方式：让二进制自己探。
      # 探的不只是 /healthz：`launchbay healthcheck` 会在 LAUNCHBAY_DATA_DIR
      # 里建删一个临时文件——65534 用户碰到 root 所属的挂载目录（群晖常见）
      # 时，只探 HTTP 会永远误报 healthy（评审 Important #9）。
      # 前提：宿主 ./data 需对该 uid 可写（chown -R 65534:65534 ./data），
      # 不满足时这里要能看到 unhealthy，而不是装作能写——失败消息里带着
      # 那条 chown 命令，读的人不用再猜是哪一侧的权限。
      test: ["CMD", "/launchbay", "healthcheck"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
